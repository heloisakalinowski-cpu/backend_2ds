            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* Efeito visual de amplificador de guitarra/linhas de áudio ao fundo */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(230, 57, 70, 0.03) 2px, transparent 2px),
                        linear-gradient(90deg, rgba(230, 57, 70, 0.03) 2px, transparent 2px);
            background-size: 40px 40px;
            z-index: 0;
            pointer-events: none;
        }

        .rock-card {
            position: relative;
            z-index: 1;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 3.5rem 2.5rem;
            border-radius: 20px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            border: 3px solid #1f2026;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6),
                        0 0 30px rgba(236, 57, 70, 0.15);
            transition: all 0.3s ease;
        }

        .rock-card::after {
            content: '';
            position: absolute;
            top: -3px; left: -3px; right: -3px; bottom: -3px;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--rock-red), transparent, var(--vinyl-gold));
            z-index: -1;
            pointer-events: none;
            opacity: 0.4;
        }

        .rock-card:hover {
            transform: scale(1.02);
            border-color: var(--rock-red);
            box-shadow: 0 25px 50px rgba(230, 57, 70, 0.3);
        }

        .vinyl-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 2rem;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Representação gráfica do Disco de Vinil girando */
        .vinyl-record {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, #000 20%, #111 21%, #111 30%, #222 31%, #000 40%, #111 41%, #222 60%, #000 70%);
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
            position: absolute;
            animation: spin 6s linear infinite;
        }

        .vinyl-cover {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            z-index: 2;
            border: 2px solid var(--vinyl-gold);
            /* Imagem Base64 interna da capa da banda */
            background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGQAAABkBAMAAACCzIhnAAAAG1BMVEUAAAD///8AAABfX19/f3+fn5+AgIC/v7/f3994B69bAAAAZElEQVRYR73VwQ3AMAgEwSdgAqdop06m8E7unwJvE6Ww8uU2m0S8pIDvK6wVz99iOn9bK6pFApYpCmsihbXQonvCOuGVbAonbAonbAonbAonvCKbIdWdIdUdUdX98fLmim828AavP9gbeQAAAABJRU5ErkJggg==");
            background-size: cover;
        }

        h3 {
            font-size: 2.4rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
            margin-bottom: 0.5rem;
            color: var(--text-light);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-shadow: 2px 2px 0px rgba(230, 57, 70, 0.5);
        }

        h3 svg {
            width: 32px;
            height: 32px;
            fill: var(--rock-red);
        }

        p {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        p svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: var(--vinyl-gold);
        }

        .btn-backstage {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 1.1rem 2rem;
            color: var(--text-light);
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: #000;
            border: 2px solid #333;
            border-radius: 8px;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.05);
        }

        .btn-backstage:hover {
            background: var(--rock-red);
            border-color: var(--text-light);
            color: #000;
            box-shadow: 0 0 20px rgba(230, 57, 70, 0.6);
            transform: translateY(-2px);
        }

        .btn-backstage svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 3;
            transition: transform 0.3s ease;
        }

        .btn-backstage:hover svg {
            transform: translateX(6px);
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <main class="rock-card">
        <div class="vinyl-container">
            <div class="vinyl-record"></div>
            <div class="vinyl-cover"></div>
